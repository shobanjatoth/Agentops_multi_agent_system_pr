services:
  - type: web
    name: agentops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: false
    healthCheckPath: /health

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: AGENTOPS_DB_PATH
        value: /tmp/agentops.db

      - key: AUTO_APPROVE_RISK_THRESHOLD
        value: "0.3"

      - key: REDIS_URL
        sync: false

      - key: LANGCHAIN_TRACING_V2
        value: "false"

      - key: LANGCHAIN_API_KEY
        sync: false

      - key: LANGCHAIN_PROJECT
        value: agentops
